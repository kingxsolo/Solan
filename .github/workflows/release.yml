# =====================================================================
#  سولان — بناء واختبار وإصدار على كل المنصات
#  - كل دفع: يبني ويختبر (ويندوز 64+32، لينكس ثابت، ماك يونيفرسال)
#  - وسم v* : يبني المُثبِّتات الأصلية وينشر إصداراً بكل الملفات
#  الحزم الناتجة: Setup.exe (ويندوز) + zip 64/32 + tar.gz لينكس ثابت
#  + deb + rpm + pkg ماك + tar.gz ماك — كلها بلا أي متطلبات خارجية
#  + نسخ بأسماء ثابتة (بلا رقم إصدار) لروابط التنزيل المباشرة في README
# =====================================================================
name: بناء-وإصدار

on:
  push:
    branches: [main, pc-edition]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  #  ويندوز: بناء أصلي 64-بت و32-بت + اختبارات + مُثبِّت عربي (x64)
  # ------------------------------------------------------------------
  windows:
    name: ويندوز ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msystem: ucrt64
            pkg: mingw-w64-ucrt-x86_64-gcc
          - arch: x86
            msystem: mingw32
            pkg: mingw-w64-i686-gcc
    steps:
      - uses: actions/checkout@v4

      - name: تجهيز مترجم مينغو-و64
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          release: false
          install: ${{ matrix.pkg }}

      - name: استخراج رقم الإصدار
        shell: msys2 {0}
        run: |
          case "$GITHUB_REF_NAME" in
            v*) VER="${GITHUB_REF_NAME#v}" ;;
            *)  VER="1.2.0" ;;
          esac
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: بناء
        shell: msys2 {0}
        run: |
          gcc -O2 -Wno-format-truncation \
              -D_WIN32_WINNT=0x0A00 \
              -o solan.exe solan.c \
              -lws2_32 -lshell32 -ladvapi32 -lm

      - name: الاختبارات (22)
        shell: msys2 {0}
        run: ./solan.exe pc/اختبار_ويندوز.سو

      - name: اختبار JIT (حلقات ساخنة + تحقق نتائج)
        shell: msys2 {0}
        run: ./solan.exe pc/اختبار_JIT.سو

      - name: إثبات التجميع (تتبع — 64-بت فقط، 32-بت مفسَّر بالتصميم)
        if: matrix.arch == 'x64'
        shell: msys2 {0}
        run: SOLAN_JIT_TRACE=1 ./solan.exe pc/اختبار_JIT.سو 2>&1 | grep "جُمّعت حلقة"

      - name: حزمة محمولة
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path حزمة | Out-Null
          Copy-Item solan.exe حزمة/
          Copy-Item README.md, LICENSE حزمة/
          Compress-Archive -Path حزمة/* -DestinationPath "Solan-$env:VER-windows-${{ matrix.arch }}.zip" -Force

      - name: المُثبِّت العربي Setup.exe (x64 فقط)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DExeName=$PWD/solan.exe" "/DSolanVersion=$env:VER" pc/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "فشل بناء المُثبِّت" }

      - name: رفع المخرجات
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            Solan-*-windows-*.zip
            dist/Solan-*-Setup-x64.exe
          if-no-files-found: warn

  # ------------------------------------------------------------------
  #  لينكس: ملف تنفيذي ثابت (musl) يعمل على أي توزيعة بلا مكتبات
  # ------------------------------------------------------------------
  linux:
    name: لينكس x64 ثابت
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: مترجم musl (للربط الثابت)
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: استخراج رقم الإصدار
        run: |
          case "$GITHUB_REF_NAME" in
            v*) VER="${GITHUB_REF_NAME#v}" ;;
            *)  VER="1.2.0" ;;
          esac
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: بناء ثابت
        run: |
          musl-gcc -O2 -Wno-format-truncation -static \
              -o solan solan.c -lm

      - name: الاختبارات (22)
        run: ./solan pc/اختبار_ويندوز.سو

      - name: اختبار JIT (حلقات ساخنة + تحقق نتائج)
        run: ./solan pc/اختبار_JIT.سو

      - name: إثبات التجميع (تتبع)
        run: SOLAN_JIT_TRACE=1 ./solan pc/اختبار_JIT.سو 2>&1 | grep "جُمّعت حلقة"

      - name: حزمة محمولة
        run: |
          mkdir -p "حزمة/Solan-$VER-linux-x64"
          cp solan README.md LICENSE "حزمة/Solan-$VER-linux-x64/"
          tar czf "Solan-$VER-linux-x64.tar.gz" -C حزمة "Solan-$VER-linux-x64"

      - name: رفع المخرجات
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: Solan-*-linux-x64.tar.gz

  # ------------------------------------------------------------------
  #  لينكس ARM64: بناء متقاطع + تنفيذ حقيقي لكود JIT المولَّد عبر QEMU
  #  (المحاكي ينفّذ تعليمات ARM64 المولَّدة فعلاً — لا مجرد فحص ترجمة)
  # ------------------------------------------------------------------
  linux-arm64:
    name: لينكس ARM64 (JIT عبر QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: مترجم متقاطع ومحاكي
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static

      - name: استخراج رقم الإصدار
        run: |
          case "$GITHUB_REF_NAME" in
            v*) VER="${GITHUB_REF_NAME#v}" ;;
            *)  VER="1.2.0" ;;
          esac
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: بناء ثابت لـARM64
        run: |
          aarch64-linux-gnu-gcc -O2 -Wno-format-truncation -static \
              -o solan-arm64 solan.c -lm

      - name: الاختبارات (22) — تنفيذ ARM64 حقيقي عبر QEMU
        run: qemu-aarch64-static ./solan-arm64 pc/اختبار_ويندوز.سو

      - name: اختبار JIT (حلقات ساخنة + تحقق نتائج)
        run: qemu-aarch64-static ./solan-arm64 pc/اختبار_JIT.سو

      - name: إثبات تجميع ARM64 (تتبع — يفشل إن صمت الـJIT بعد أي خلل)
        run: SOLAN_JIT_TRACE=1 qemu-aarch64-static ./solan-arm64 pc/اختبار_JIT.سو 2>&1 | grep "جُمّعت حلقة"

      - name: حزمة محمولة
        run: |
          mkdir -p "حزمة/Solan-$VER-linux-arm64"
          cp solan-arm64 "حزمة/Solan-$VER-linux-arm64/solan"
          cp README.md LICENSE "حزمة/Solan-$VER-linux-arm64/"
          tar czf "Solan-$VER-linux-arm64.tar.gz" -C حزمة "Solan-$VER-linux-arm64"

      - name: رفع المخرجات
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: Solan-*-linux-arm64.tar.gz

  # ------------------------------------------------------------------
  #  حزم لينكس الأصلية: deb (ديبيان/أوبونتو) و rpm (فيدورا/ريد هات)
  # ------------------------------------------------------------------
  linux-pkg:
    name: حزم لينكس deb و rpm
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: مدخل

      - name: فك الحزمة
        run: |
          VER=$(ls مدخل/Solan-*-linux-x64.tar.gz | head -n1 | sed 's/.*Solan-\(.*\)-linux-x64.tar.gz/\1/')
          echo "VER=$VER" >> "$GITHUB_ENV"
          tar xzf "مدخل/Solan-$VER-linux-x64.tar.gz" -C مدخل

      - name: بناء deb
        run: |
          mkdir -p deb/DEBIAN deb/usr/bin deb/usr/share/doc/solan
          install -m755 "مدخل/Solan-$VER-linux-x64/solan" deb/usr/bin/solan
          install -m644 "مدخل/Solan-$VER-linux-x64/LICENSE" deb/usr/share/doc/solan/copyright
          cat > deb/DEBIAN/control <<EOF
          Package: solan
          Version: $VER
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: Solan Project <pc@solan.local>
          Description: سولان — لغة برمجة عربية
           ملف تنفيذي ثابت لا يحتاج أي مكتبات خارجية. يدعم JIT على x86-64.
          EOF
          dpkg-deb --build --root-owner-group deb "solan_${VER}_amd64.deb"

      - name: بناء rpm
        run: |
          sudo apt-get install -y rpm
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p "solan-$VER"
          cp "مدخل/Solan-$VER-linux-x64/solan" "solan-$VER/solan"
          tar czf "rpmbuild/SOURCES/solan-$VER.tar.gz" "solan-$VER"
          cat > rpmbuild/SPECS/solan.spec <<EOF
          Name:           solan
          Version:        $VER
          Release:        1%{?dist}
          Summary:        سولان — لغة برمجة عربية
          License:        MIT
          URL:            https://github.com/kingxsolo/Solan
          Source0:        solan-%{version}.tar.gz
          BuildArch:      x86_64
          AutoReqProv:    no
          %description
          ملف تنفيذي ثابت لا يحتاج أي مكتبات خارجية. يدعم JIT على x86-64.
          %prep
          %setup -q
          %install
          install -Dm755 solan %{buildroot}/usr/bin/solan
          %files
          /usr/bin/solan
          EOF
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/solan.spec
          cp rpmbuild/RPMS/x86_64/solan-$VER-1*.x86_64.rpm .

      - name: رفع المخرجات
        uses: actions/upload-artifact@v4
        with:
          name: linux-pkg
          path: |
            solan_*_amd64.deb
            solan-*.x86_64.rpm

  # ------------------------------------------------------------------
  #  ماك: ملف يونيفرسال (Intel + Apple Silicon) + مُثبِّت pkg
  # ------------------------------------------------------------------
  macos:
    name: ماك يونيفرسال
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: استخراج رقم الإصدار
        run: |
          case "$GITHUB_REF_NAME" in
            v*) VER="${GITHUB_REF_NAME#v}" ;;
            *)  VER="1.2.0" ;;
          esac
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: بناء يونيفرسال (Intel مع JIT + Apple Silicon)
        run: |
          clang -O2 -Wno-format-truncation \
              -arch x86_64 -mmacosx-version-min=11.0 \
              -o solan-intel solan.c -lm
          clang -O2 -Wno-format-truncation \
              -arch arm64 -mmacosx-version-min=11.0 \
              -o solan-arm64 solan.c -lm
          lipo -create solan-intel solan-arm64 -o solan
          file solan
          lipo -info solan

      - name: الاختبارات (22) — Apple Silicon الأصلي
        run: ./solan pc/اختبار_ويندوز.سو

      - name: اختبار JIT — Apple Silicon الأصلي (شريحة arm64 مع JIT مفعّل)
        run: ./solan pc/اختبار_JIT.سو

      - name: إثبات تجميع ARM64 (تتبع)
        run: SOLAN_JIT_TRACE=1 ./solan pc/اختبار_JIT.سو 2>&1 | grep "جُمّعت حلقة"

      - name: الاختبارات (22) — شريحة Intel مع JIT عبر Rosetta
        run: |
          if [ -d /Library/Apple/usr/libexec/oah ]; then
            arch -x86_64 ./solan pc/اختبار_ويندوز.سو
            arch -x86_64 ./solan pc/اختبار_JIT.سو
          else
            echo "Rosetta غير متوفرة على هذا العدّاء — تخطي اختبار شريحة Intel"
          fi

      - name: حزمة محمولة
        run: |
          mkdir -p "حزمة/Solan-$VER-macos"
          cp solan README.md LICENSE "حزمة/Solan-$VER-macos/"
          tar czf "Solan-$VER-macos-universal.tar.gz" -C حزمة "Solan-$VER-macos"

      - name: المُثبِّت pkg
        run: |
          mkdir -p pkgroot/usr/local/bin
          cp solan pkgroot/usr/local/bin/
          pkgbuild --root pkgroot \
                   --identifier io.github.kingxsolo.solan \
                   --version "$VER" \
                   --install-location / \
                   "solan-core-$VER.pkg"
          productbuild --package "solan-core-$VER.pkg" \
                       --identifier io.github.kingxsolo.solan \
                       "Solan-$VER-macos.pkg"

      - name: رفع المخرجات
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            Solan-*-macos-universal.tar.gz
            Solan-*-macos.pkg

  # ------------------------------------------------------------------
  #  النشر: عند وسم v* فقط — يجمع كل المخرجات وينشر الإصدار
  # ------------------------------------------------------------------
  release:
    name: نشر الإصدار
    needs: [windows, linux, linux-arm64, linux-pkg, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: إصدار
          merge-multiple: true

      # نسخ بأسماء بلا رقم إصدار: روابط releases/latest/download/ في README
      # تنزّل دائماً أحدث إصدار دون تعديل الروابط
      - name: أسماء ثابتة للروابط المباشرة
        run: |
          cd إصدار
          # تسطيح: أرتيفكت ويندوز يحفظ المُثبِّت تحت dist/ — ننقله للجذر
          if [ -d dist ]; then mv dist/* . && rmdir dist; fi
          cp Solan-*-Setup-x64.exe          Solan-Setup-x64.exe
          cp Solan-*-windows-x64.zip        Solan-windows-x64.zip
          cp Solan-*-windows-x86.zip        Solan-windows-x86.zip
          cp Solan-*-linux-x64.tar.gz       Solan-linux-x64.tar.gz
          cp Solan-*-linux-arm64.tar.gz     Solan-linux-arm64.tar.gz
          cp solan_*_amd64.deb              solan_amd64.deb
          cp solan-*x86_64.rpm              solan.x86_64.rpm
          cp Solan-*-macos.pkg              Solan-macos.pkg
          cp Solan-*-macos-universal.tar.gz Solan-macos-universal.tar.gz
          ls -1

      - name: ملاحظات الإصدار
        run: |
          cat > ملاحظات.md <<'EOF'
          ## سولان — التثبيت حسب منصتك

          | منصتك | الملف | الطريقة |
          |---|---|---|
          | ويندوز 64-بت | `Solan-*-Setup-x64.exe` | شغّله واتبع الخطوات (واجهة عربية: PATH + ربط الملفات + إزالة تثبيت) |
          | ويندوز (بدون تثبيت) | `Solan-*-windows-x64.zip` / `x86.zip` | فك الضغط وشغّل `solan.exe` |
          | لينكس (أي توزيعة) | `Solan-*-linux-x64.tar.gz` | `tar xzf` ثم انسخ `solan` إلى `~/.local/bin` — **ثابت، بلا أي مكتبات** |
          | لينكس ARM64 (راسبيري باي 5، خوادم ARM) | `Solan-*-linux-arm64.tar.gz` | `tar xzf` ثم انسخ `solan` — **ثابت، بلا أي مكتبات** |
          | أوبونتو/ديبيان | `solan_*_amd64.deb` | `sudo apt install ./الملف.deb` |
          | فيدورا/ريد هات | `solan-*.x86_64.rpm` | `sudo rpm -i الملف.rpm` أو `sudo dnf install ./الملف.rpm` |
          | ماك (Intel + Apple Silicon) | `Solan-*-macos.pkg` | شغّله — يثبّت في `/usr/local/bin` (إن منع الماك: زر يمين ← فتح) |
          | ماك (بدون تثبيت) | `Solan-*-macos-universal.tar.gz` | فك الضغط وشغّل `solan` |
          | ترمكس (أندرويد) | — | `pkg install -y clang git` ثم `git clone https://github.com/kingxsolo/Solan && cd Solan && sh install.sh` (بناء من المصدر داخل ترمكس، دقائق قليلة) |

          **من المصدر على أي منصة**: `sh install.sh` — يكتشف بيئتك ويبني ويثبّت.
          التفاصيل الكاملة في [README.md](README.md).

          الملفات ذات الأسماء بلا رقم إصدار (مثل `Solan-windows-x64.zip`) نسخ ثابتة
          تُرفع مع كل إصدار — روابط `releases/latest/download/` تنزّل دائماً الأحدث.

          - ويندوز 64-بت ولينكس 64-بت ولينكس ARM64 وماك (Intel وApple Silicon): **JIT مفعّل** (حلقات أسرع بعدة مرات)
          - ويندوز 32-بت: مفسَّر كامل الوظائف
          - قاعدة_سريعة (مخزن مفاتيح-قيم سولاني) مضمّنة في كل الملفات
          EOF

      - name: نشر الإصدار
        uses: softprops/action-gh-release@v2
        with:
          files: إصدار/*
          body_path: ملاحظات.md
